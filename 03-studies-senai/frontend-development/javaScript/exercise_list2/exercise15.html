<body>
    <h1>Preencha com suas informações abaixo</h1>
    <form action="#" method="post">

        <label for="iNome">Nome</label>
        <input type="text" id="iNome" />

        <label for="iemail">Email</label>
        <input type="email" name="" id="iemail" />

        <input type="submit" value="Enviar" id="btn" />
    </form>
</body>
<script>
    const inputNome = document.querySelector("#iNome");
    const inputEmail = document.querySelector("#iemail");

    const form = document.querySelector("form");
    const msg = document.querySelector("#msg");

    form.addEventListener("submit", (event) => {

        event.preventDefault();

        if (!inputNome.value.trim() || !inputEmail.value.trim()) {
            alert("Preencha todos os campos!");
            return;
        }

        alert(`Nome do usuário: ${inputNome.value} \nE-mail do usuário: ${inputEmail.value}`);
    });

</script>
