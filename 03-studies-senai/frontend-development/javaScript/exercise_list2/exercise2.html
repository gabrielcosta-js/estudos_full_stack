<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 2</title>
   
</head>
<body>
    <h1 id="titulo">Clique no Botão para alterar a cor título</h1>
    <button id="btn">Alterar Título</button>
    <button id="btnResetar">Resetar Estilo</button>
</body>
<script>
    const h1_titulo = document.getElementById("titulo");
    const btn = document.getElementById("btn");
    const btnResetar = document.getElementById("btnResetar")

    btn.addEventListener('click', () => {
        h1_titulo.style.color = 'red'
        h1_titulo.style.fontSize = '30px'
    });
    btnResetar.addEventListener('click', () => {
        h1_titulo.style.color = 'initial'
        h1_titulo.style.fontSize = 'initial'
    });
</script>
</html>
