<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercício 17</title>
    <style>
      button {
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <h1>Veja a lista abaixe e filtre</h1>
    <input type="text" id="ifiltro" />
    <ul>
      <li>Arroz</li>
      <li>Feijão</li>
      <li>Batata</li>
      <li>Bola</li>
      <li>Avião</li>
      <li>Acerola</li>
      <li>Balão</li>
    </ul>
    <button id="btn">Filtrar</button>
  </body>
  <script>
    const btn = document.getElementById("btn");
    const ifiltro = document.getElementById("ifiltro");

    ifiltro.addEventListener("input", () => {
      const texto = ifiltro.value.trim().toLowerCase();
      const li = document.querySelectorAll("li");

      li.forEach((lis) => {
        const item_lista = lis.textContent.toLowerCase();

        if (texto === "") {
          lis.style.display = "list-item";
        } else if (item_lista.includes(texto)) {
          lis.style.display = "list-item";
        } else {
          lis.style.display = "none";
        }
      });
    });
  </script>
</html>
